# CI for Windmorph's public repo: builds, typechecks, lints and tests `@windmorph/react`,
# Storybook, the Next.js playground and the docs site, then records the site's home page bento
# video and runs the site's internal link check and Playwright smoke suite against its static
# export, Storybook's Playwright suite (with its Linux screenshot baselines, in Docker), and the
# playground's Playwright suite (every export imported into a Server Component, under
# `next start` and `next dev`).
#
# The docs site also documents Windmorph Pro, which it installs from the private
# `windmorph-pro` repo's `dist` branch (an optional dependency). `PRO_READ_TOKEN` is a
# fine-grained token with read-only access to that repo. A pull request from a fork gets no
# secrets, so pnpm skips Pro (it's optional) and the site's build and smoke suite fail there.
name: CI

on:
  push:
    branches: ['main']
  pull_request:
    types: [opened, synchronize, reopened]

# Every job only reads the repository.
permissions:
  contents: read

env:
  PRO_READ_TOKEN: ${{ secrets.PRO_READ_TOKEN }}

jobs:
  build-and-check:
    name: Build, typecheck, lint & test
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from package.json's `packageManager` (pnpm@12.8.1); giving
      # `version` as well makes the action fail with two versions specified.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # Lets pnpm fetch Windmorph Pro from its private repo (see the note at the top).
      - name: Allow installing Windmorph Pro
        if: ${{ env.PRO_READ_TOKEN != '' }}
        run: git config --global url."https://x-access-token:${PRO_READ_TOKEN}@github.com/XManhTrinh/windmorph-pro".insteadOf "https://github.com/XManhTrinh/windmorph-pro"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      # Public files stay neutral: see scripts/check-traces.mjs.
      - name: Check for traces
        run: pnpm check:traces

      # Builds `@windmorph/react` and `apps/site`, then typechecks, lints (--max-warnings 0) and runs
      # the library's Vitest suite across the whole monorepo.
      - name: Build, typecheck, lint & test
        run: pnpm turbo run build typecheck lint test

      # Each public component's gzipped size (its module plus the library modules it imports,
      # from the built dist) against packages/react/bundle-size.json: fails past a 2% tolerance.
      - name: Check bundle sizes
        run: pnpm turbo run size --filter=@windmorph/react

  # The docs site's static export, built once for the Playwright shards below: build, record
  # the home page bento video from that build (phones see the video), build again so the home
  # page picks the video up, then check the internal links. The export and the media go to the
  # shards as an artifact.
  site-build:
    name: Site build, bento video & link check
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from package.json's `packageManager` (pnpm@12.8.1); giving
      # `version` as well makes the action fail with two versions specified.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # Lets pnpm fetch Windmorph Pro from its private repo (see the note at the top).
      - name: Allow installing Windmorph Pro
        if: ${{ env.PRO_READ_TOKEN != '' }}
        run: git config --global url."https://x-access-token:${PRO_READ_TOKEN}@github.com/XManhTrinh/windmorph-pro".insteadOf "https://github.com/XManhTrinh/windmorph-pro"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The recorder plays the bento in Playwright's Chromium.
      - name: Install Playwright browsers
        run: pnpm --filter site exec playwright install --with-deps chromium

      - name: Build the site
        run: pnpm turbo run build --filter=site

      # Phones see the home page bento as a video recorded from the built site, so it always
      # matches the bento. ffmpeg writes the H.264 MP4 (for Safari on iPhone) and the WebM.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Record the bento video
        run: pnpm --filter site record:bento

      - name: Upload the bento video
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bento-video
          path: apps/site/public/media/bento/
          retention-days: 7

      # The media are an input of `site#build` (apps/site/turbo.json), so this builds again and
      # the home page picks the video up.
      - name: Build the site with the bento video
        run: pnpm turbo run build --filter=site

      # Depends on `site#build`, cached by now, so it checks that `out/`.
      - name: Link check
        run: pnpm turbo run link-check --filter=site

      # The export and the media (the video spec reads the manifest) for the shards.
      - name: Upload the static export
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-export
          path: |
            apps/site/out/
            apps/site/public/media/bento/
          retention-days: 1

  # The site's Playwright suite against that export, in two parallel shards: every page (component
  # tabs included) gets an axe scan in light and dark mode. `--fully-parallel` lets the shards
  # split the one large smoke file by test rather than by file. The `next-dev` project's
  # suites run under `next dev`, so each shard builds the core and generates the props too.
  site-e2e:
    name: Site Playwright smoke suite (shard ${{ matrix.shard }}/2)
    needs: site-build
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      CI: 'true'
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from package.json's `packageManager` (pnpm@12.8.1).
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # Lets pnpm fetch Windmorph Pro from its private repo (see the note at the top).
      - name: Allow installing Windmorph Pro
        if: ${{ env.PRO_READ_TOKEN != '' }}
        run: git config --global url."https://x-access-token:${PRO_READ_TOKEN}@github.com/XManhTrinh/windmorph-pro".insteadOf "https://github.com/XManhTrinh/windmorph-pro"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter site exec playwright install --with-deps chromium

      # What `next dev` needs: the built core and the generated props.
      - name: Build the core and generate the props
        run: pnpm turbo run build --filter=@windmorph/react && pnpm turbo run generate --filter=site

      - name: Download the static export
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-export
          path: apps/site/

      - name: Playwright smoke suite
        run: pnpm --filter site exec playwright test --fully-parallel --shard=${{ matrix.shard }}/2

      # The failed tests' traces.
      - name: Upload the test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-e2e-results-${{ matrix.shard }}
          path: apps/site/test-results/
          retention-days: 7

  # Storybook's Playwright suite (`apps/docs/e2e`: visual regression, computed styles,
  # interaction and layout safety) on Linux, against the `*-chromium-linux.png` baselines. It
  # runs in the official Playwright image for the repo's Playwright version, through the same
  # script that records the baselines (`pnpm test:e2e:linux`, see "Linux screenshot baselines"
  # in docs/architecture.md), on arm64 runners: the baselines are recorded on arm64, and an
  # x86 Chromium can rasterise a few pixels differently. Split into four shards, in parallel.
  storybook-e2e:
    name: Storybook Playwright suite (shard ${{ matrix.shard }}/4)
    timeout-minutes: 30
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: 'true'
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from package.json's `packageManager` (pnpm@12.8.1).
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # Storybook documents only the public core, so Windmorph Pro (optional) isn't needed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds `@windmorph/react`, then the static Storybook the suite serves.
      - name: Build Storybook
        run: pnpm turbo run build --filter=docs

      - name: Storybook Playwright suite
        run: pnpm test:e2e:linux --shard=${{ matrix.shard }}/4

      # The failed tests' traces and screenshot diffs.
      - name: Upload the test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-e2e-results-${{ matrix.shard }}
          path: apps/docs/test-results/
          retention-days: 7

  playground-e2e:
    name: Playground Playwright suite
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from package.json's `packageManager` (pnpm@12.8.1).
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # The playground uses only the public core, so Windmorph Pro (optional) isn't needed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter next-playground exec playwright install --with-deps chromium

      # `test:e2e` depends on `next-playground#build`, which builds `@windmorph/react` first.
      - name: Playwright suite
        run: pnpm turbo run test:e2e --filter=next-playground

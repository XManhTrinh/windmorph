packages:
  - packages/*
  - apps/*
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.7'
  - '@turbo/darwin-arm64@2.11.7'
  - '@turbo/linux-64@2.11.7'
  - '@turbo/linux-arm64@2.11.7'
  - '@turbo/windows-64@2.11.7'
  - '@turbo/windows-arm64@2.11.7'
  - globals@17.13.0
  - motion-dom@14.0.0
  - motion-utils@14.0.0
  - motion@14.0.0
  - turbo@2.11.7
  - vite@8.3.3
  - '@next/env@16.4.0'
  - '@next/mdx@16.4.0'
  - '@next/swc-darwin-arm64@16.4.0'
  - '@next/swc-darwin-x64@16.4.0'
  - '@next/swc-linux-arm64-gnu@16.4.0'
  - '@next/swc-linux-arm64-musl@16.4.0'
  - '@next/swc-linux-x64-gnu@16.4.0'
  - '@next/swc-linux-x64-musl@16.4.0'
  - '@next/swc-win32-arm64-msvc@16.4.0'
  - '@next/swc-win32-x64-msvc@16.4.0'
  - next@16.4.0

allowBuilds:
  esbuild: true
  '@parcel/watcher': true
  # Postinstall only fetches a fallback binary; the prebuilt optional dependency is used.
  unrs-resolver: false

overrides:
  # Security floors for packages other tools pin below a fixed version.
  handlebars: 4.7.10
  glob@>=9 <14.0.2: ^14.0.4
  minimatch@>=7 <11.0.1: ^11.0.5
  # Tailwind is held at 4.3.3: under 4.3.5, `next dev --webpack` (the site's dev server)
  # crashes when two pages compile at once. See "Tailwind is held at 4.3.3" in
  # docs/architecture.md; delete these five lines to move it.
  tailwindcss: 4.3.3
  '@tailwindcss/cli': 4.3.3
  '@tailwindcss/node': 4.3.3
  '@tailwindcss/postcss': 4.3.3
  '@tailwindcss/vite': 4.3.3
